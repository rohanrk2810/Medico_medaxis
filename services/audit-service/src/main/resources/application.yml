server:
  port: ${PORT:8083}
spring:
  application:
    name: audit-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server.error.include-message: never
server.error.include-stacktrace: never
