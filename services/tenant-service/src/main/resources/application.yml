server:
  port: ${PORT:8082}
spring:
  application:
    name: tenant-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server.error.include-message: never
server.error.include-stacktrace: never
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${IDENTITY_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences: medical-erp
spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${IDENTITY_JWKS_URI}
